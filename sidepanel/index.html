<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek Sidebar</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="tools">
    <div class="toolbar-row">
      <span id="prefillStatus" role="status" aria-live="polite"></span>
      <div class="tool-actions">
        <a class="settings-link" href="../options/index.html" target="_blank" aria-label="打开设置" title="设置">⚙</a>
        <button id="insertLink" type="button" disabled>插入链接</button>
        <button id="insertArticle" class="primary" type="button" disabled>插入正文</button>
      </div>
    </div>
  </div>
  <main>
    <iframe id="chatFrame" title="DeepSeek Chat" src="https://chat.deepseek.com/" allow="clipboard-write"></iframe>
  </main>
</body>
</html>
